name: grow

# Runs ONCE per hour and applies an hour's worth of growth in a single request
# (the endpoint's TICKS_PER_RUN). It used to loop internally — one call every 5
# minutes for ~an hour — which meant the database was queried around the clock
# and its serverless compute NEVER auto-suspended (Neon suspends after ~5 min
# idle). That burned the whole monthly compute quota: every query then failed
# with HTTP 402 and the live site rendered empty on every page.
#
# So: keep the gaps long enough for the compute to sleep. Don't reintroduce a
# short interval or an internal sleep loop.
#
# The minute is offset from :00 because GitHub delays runs scheduled on the hour
# (everyone's crons pile up there).
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

# Never run two of these at once; a new trigger waits for the current one.
concurrency:
  group: grow
  cancel-in-progress: false

jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply one hour of growth
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://anor-sable.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is empty. Add it as a *Repository* secret"
            echo "::error::(Settings → Secrets and variables → Actions → Secrets tab),"
            echo "::error::name CRON_SECRET, value matching Vercel's CRON_SECRET env."
            exit 1
          fi
          code=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X POST "$SITE_URL/api/cron/grow" -H "x-cron-secret: $CRON_SECRET")
          echo "HTTP $code  $(cat /tmp/resp.json 2>/dev/null)"
          if [ "$code" != "200" ]; then
            echo "::error::Growth endpoint returned $code. 401 = the GitHub CRON_SECRET"
            echo "::error::does not match Vercel's CRON_SECRET env. 500 with a quota/"
            echo "::error::compute message in \"detail\" = the database is out of quota."
            exit 1
          fi
